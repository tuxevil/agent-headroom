name: Solar small-model catalog checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  solar-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate IA Solar hybrid KV catalog and estimates
        run: python3 -m unittest discover -s tests -p 'test_solar_catalog.py' -v
      - name: Confirm custom catalog can be generated offline
        run: |
          python3 -m bench.solar_catalog --out out/catalog-solar.json
          python3 -c "from bench.catalog import load_catalog; c=load_catalog('out/catalog-solar.json'); assert len([m for m in c['models'] if m['id']=='gemma4-e2b']) == 1"
